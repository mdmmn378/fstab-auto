[package]
name = "fstab-auto"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Interactive TUI for mounting NAS shares (CIFS/SMB) temporarily or permanently via /etc/fstab"
license = "MIT"
repository = "https://github.com/mdmmn378/fstab-auto"
readme = "README.md"
keywords = ["mount", "cifs", "smb", "fstab", "tui"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
clap_complete = "4.6.12"
libc = "0.2.191"
ratatui = "0.30.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
